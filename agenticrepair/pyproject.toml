[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "smolagents"
version = "1.23.0"
description = "🤗 smolagents: a barebones library for agents. Agents write python code to call tools or orchestrate other agents."
authors = [
  { name="Aymeric Roucher", email="aymeric@hf.co" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.31.2,<1.0.0",
  "requests>=2.32.3",
  "rich>=13.9.4",
  "jinja2>=3.1.4",
  "pillow>=10.0.1",
  # Security fix for CVE-2023-4863: https://pillow.readthedocs.io/en/stable/releasenotes/10.0.1.html
  "python-dotenv",
]

[project.optional-dependencies]
docker = [
  "docker>=7.1.0",
  "websocket-client",
]
litellm = [
  "litellm>=1.60.2",
]
secb = [
    "tomli>=2.0.0",  # TOML parser for Python < 3.11 (Python 3.11+ has tomllib built-in)
    "datasets>=2.0.0",  # HuggingFace datasets for SEC-bench evaluation
    "loguru>=0.7.0",  # used by secb.evaluator
]

[tool.ruff]
line-length = 119
lint.ignore = [
  "F403", # undefined-local-with-import-star
  "E501", # line-too-long
]
lint.select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["smolagents"]
lines-after-imports = 2

[tool.setuptools.package-data]
"smolagents.prompts" = ["*.yaml", "*.j2", "*/*.j2"]

[project.scripts]
smolagent = "smolagents.cli:main"
